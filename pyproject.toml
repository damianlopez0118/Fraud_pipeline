[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-pipeline"
version = "0.1.0"
description = "End-to-end fraud detection data/ML pipeline: data quality, features, XGBoost, MLflow, drift monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "xgboost",
    "mlflow",
    "plotly",
]

[project.optional-dependencies]
spark = ["pyspark"]
dev = ["pytest", "ruff"]

[project.scripts]
fraud-pipeline = "fraud_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
