[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-pipeline"
version = "0.1.0"
description = "End-to-end fraud detection data/ML pipeline: data quality, features, XGBoost, MLflow, drift monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "mlflow==3.18.0",
    "plotly==7.1.0",
]

[project.optional-dependencies]
spark = ["pyspark"]
dev = ["pytest", "ruff"]
monitoring = ["databricks-sdk>=0.40,<1"]
agent = [
    "langgraph>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
fraud-pipeline = "fraud_pipeline.pipeline:main"
fraud-pipeline-databricks = "fraud_pipeline.pipeline:run_databricks"
fraud-dashboard = "fraud_pipeline.dashboard_server:main"
socure-monitor = "fraud_pipeline.socure_refresh:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
